<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 代碼下載器</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans"
  >
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-3xl">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">
        HTML 代碼轉換及下載器
      </h1>
      <p class="text-gray-600 mb-6">
        將你嘅 HTML 代碼貼喺下面，系統會自動幫你打包成
        <code>myapp.html</code> 檔案下載。唔使再煩 Windows 隱藏副檔名嘅問題！
      </p>

      <div class="mb-4">
        <label
          for="htmlInput"
          class="block text-sm font-medium text-gray-700 mb-2"
          >貼上 HTML 代碼：</label
        >
        <textarea
          id="htmlInput"
          rows="12"
          class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm"
          placeholder="<!DOCTYPE html>&#10;<html>&#10;...&#10;</html>"
        ></textarea>
      </div>

      <div class="flex justify-end">
        <button
          id="downloadBtn"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition-colors duration-200 flex items-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          下載 myapp.html
        </button>
      </div>
    </div>

    <script>
      document.getElementById("downloadBtn").addEventListener("click", () => {
        const htmlContent = document.getElementById("htmlInput").value.trim();

        if (!htmlContent) {
          alert("請先貼上 HTML 代碼！");
          return;
        }

        // 建立 Blob 物件將純文字轉換為檔案格式
        const blob = new Blob([htmlContent], {
          type: "text/html;charset=utf-8",
        });

        // 建立暫時下載連結
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "myapp.html"; // 強制設定下載檔名，解決副檔名痛點

        // 觸發點擊並自動清理記憶體
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
